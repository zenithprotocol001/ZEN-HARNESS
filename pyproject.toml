[project]
name = "dhc-benchmark"
version = "0.1.0"
description = "DeepSeek Harness Creation Benchmark"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "pytest-asyncio>=0.23",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
playwright = [
    "playwright>=1.40",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
